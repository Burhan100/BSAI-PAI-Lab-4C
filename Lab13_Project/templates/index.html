<!DOCTYPE html>
<html>
<head>
    <title>NLP Sentiment Analyzer - Lab 13</title>
    <style>
        body { font-family: Arial; background: #f0f0f0; padding: 40px; text-align: center; }
        textarea { width: 500px; height: 120px; padding: 10px; font-size: 15px; border-radius: 5px; border: 1px solid #ccc; }
        button { display: block; margin: 10px auto; padding: 12px 30px; background: #5c6bc0; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .result-card { background: white; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 20px; min-width: 300px; }
    </style>
</head>
<body>
    <h1>🧠 NLP Sentiment Analyzer</h1>
    <p>PAI Lab 13 Project - Built with Flask + TextBlob</p>

    <form method="POST">
        <textarea name="text" placeholder="Enter any text to analyze..." required>{{ text }}</textarea>
        <button type="submit">Analyze</button>
    </form>

    {% if result %}
    <div class="result-card">
        <h2 style="color: {{ result.color }}">{{ result.sentiment }}</h2>
        <p>📊 Polarity Score: <strong>{{ result.polarity }}</strong> (range: -1 to 1)</p>
        <p>💬 Subjectivity: <strong>{{ result.subjectivity }}</strong> (0=objective, 1=subjective)</p>
    </div>
    {% endif %}
</body>
</html>
